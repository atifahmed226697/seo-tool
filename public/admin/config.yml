backend:
  name: github
  repo: atifahmed226697/seo-tool
  branch: main

local_backend: true

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog Posts
    folder: content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: "blog/{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string

      - label: Meta Description
        name: description
        widget: text

      - label: SEO Title
        name: seoTitle
        widget: string
        required: false
        hint: Leave empty to use the article title.

      - label: Publication Date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD

      - label: Last Updated
        name: updated
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        required: false

      - label: Category
        name: category
        widget: string

      - label: Cover Image
        name: image
        widget: image
        required: false
        hint: Upload a compressed image.

      - label: Draft
        name: draft
        widget: boolean
        default: true
        required: false
        hint: Turn off when the article is ready to appear on the website.

      - label: Content
        name: body
        widget: markdown

  - name: tool_pages
    label: Tool Pages
    folder: content/tools
    extension: json
    format: json
    create: false
    delete: false
    identifier_field: aboutTitle
    summary: "{{slug}}"
    preview_path: "tools/{{slug}}"
    fields:

      - label: SEO Title
        name: seoTitle
        widget: string
        required: false
        hint: Leave empty to use the existing page title.

      - label: Meta Description
        name: metaDescription
        widget: text
        required: false
        hint: Leave empty to use the existing page description.

      - label: Explanation Heading
        name: aboutTitle
        widget: string

      - label: Explanation
        name: about
        widget: text

      - label: Example Heading
        name: exampleTitle
        widget: string

      - label: Example
        name: example
        widget: text

      - label: Frequently Asked Questions
        name: faqs
        widget: list
        summary: "{{fields.question}}"
        fields:
          - label: Question
            name: question
            widget: string

          - label: Answer
            name: answer
            widget: text
